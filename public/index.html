<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>Upload Gambar</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font:16px/1.5 system-ui,-apple-system,sans-serif}
    main{max-width:560px;margin:40px auto;padding:24px} .panel{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 8px 30px #1118270a}
    h1{font-size:25px;margin:0 0 8px}p{color:#6b7280;margin:0 0 22px}.pick{display:block;border:2px dashed #cbd5e1;border-radius:14px;padding:28px 18px;text-align:center;cursor:pointer;background:#f8fafc}
    input[type=file]{display:none}img{display:none;width:100%;max-height:340px;object-fit:contain;margin-top:18px;border-radius:12px;background:#f3f4f6}
    input[type=text]{width:100%;padding:13px;border:1px solid #d1d5db;border-radius:10px;font:inherit;margin-top:16px}
    button{width:100%;border:0;border-radius:10px;padding:14px;font:600 16px system-ui;cursor:pointer;margin-top:16px;background:#111827;color:white}
    button:disabled{opacity:.5;cursor:not-allowed}.result{display:none;margin-top:18px;padding:14px;border-radius:10px;background:#ecfdf5;overflow-wrap:anywhere}.result a{color:#047857}
    #status{margin-top:14px;font-size:14px;color:#4b5563;white-space:pre-wrap}.hint{font-size:13px;margin-top:12px}
    @media(max-width:600px){main{margin:12px auto;padding:12px}.panel{padding:20px}}
  </style>
</head>
<body>
<main><section class="panel">
  <h1>Upload gambar</h1>
  <p>Pilih foto, lihat pratinjau, lalu unggah.</p>
  <label class="pick" for="file">📷<br><strong>Pilih gambar dari perangkat</strong><br><small>JPG, PNG, atau WebP · Maksimal 8 MB</small></label>
  <input id="file" type="file" accept="image/jpeg,image/png,image/webp">
  <img id="preview" alt="Pratinjau gambar">
  <input id="filename" type="text" maxlength="80" placeholder="Nama file (opsional), contoh: murai-batu">
  <button id="upload" disabled>Unggah gambar</button>
  <div id="status" role="status"></div>
  <div class="result" id="result"><strong>Gambar berhasil diunggah.</strong><br><a id="url" target="_blank" rel="noopener">Buka gambar</a><button id="copy" type="button">Salin URL gambar</button></div>
  <p class="hint">Saran: gunakan nama file yang singkat dan sesuai isi gambar.</p>
</section></main>
<script>
const fileInput=document.querySelector('#file'),preview=document.querySelector('#preview'),upload=document.querySelector('#upload'),statusEl=document.querySelector('#status'),filename=document.querySelector('#filename'),result=document.querySelector('#result'),urlEl=document.querySelector('#url');
let selected=null;
fileInput.addEventListener('change',()=>{
 selected=fileInput.files?.[0]||null;result.style.display='none';statusEl.textContent='';
 if(!selected){upload.disabled=true;preview.style.display='none';return}
 if(!selected.type.startsWith('image/')){statusEl.textContent='File harus berupa gambar.';selected=null;upload.disabled=true;return}
 if(selected.size>8*1024*1024){statusEl.textContent='Ukuran gambar maksimal 8 MB.';selected=null;upload.disabled=true;preview.style.display='none';return}
 preview.src=URL.createObjectURL(selected);preview.style.display='block';upload.disabled=false;
 if(!filename.value)filename.value=selected.name.replace(/\.[^.]+$/,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();
});
upload.addEventListener('click',async()=>{
 if(!selected)return;upload.disabled=true;statusEl.textContent='Mengunggah gambar…';
 try{
  const fd=new FormData();fd.append('file',selected);fd.append('filename',filename.value);
  const res=await fetch('/api/upload',{method:'POST',body:fd});const data=await res.json();
  if(!res.ok)throw new Error(data.error||'Upload gagal.');
  urlEl.href=data.url;urlEl.textContent=data.url;result.style.display='block';statusEl.textContent='Selesai. Salin URL untuk digunakan di artikel.';
 }catch(e){statusEl.textContent=e.message||'Terjadi kesalahan.'}
 finally{upload.disabled=false}
});
document.querySelector('#copy').addEventListener('click',async()=>{
 try{await navigator.clipboard.writeText(urlEl.href);statusEl.textContent='URL berhasil disalin.'}
 catch{statusEl.textContent='Salin URL dari tautan di atas.'}
});
</script>
</body></html>
